<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YenCryto - Basic Caeser Cipher Implementation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    
    <div class="container">
         <header>    <!--Header Section-->
            <h1>Caeser Cipher</h1>
            <p>A simple encryption tool using classic letter-shift method</p>
         </header>   <!--Header Section-->

         <div class="card"> <!--Body Section-->
             <div class="card-header">
                <h2>Caeser Cipher Tool</h2>
                <p>Encrypt or decrypt text by shifting letters</p>
             </div>
        

            <div class="card-content">
                <div class="tabs">
                   <button class="tab active" data-mode="encrypt">Encrypt</button>
                   <button class="tab" data-mode="decrypt">Decrypt</button>
                </div>

                <div class="form-group">
                   <label id="input-label">Orignal Text</label>
                   <textarea id="input-text" placeholder="Enter text to encrypt..."></textarea>
                </div>

                <div class="arrow">-></div>
             
                <div class="form-group">
                    <label id="output-label">Encrypted Result</label>
                    <div class="output-container">
                       <textarea id="output-text" readonly></textarea>
                      <button id="copy-btn" class="copy-btn">Copy</button>
                    </div>
                </div>
            </div>
        </div>               <!--Body Section-->

        <footer>             <!--footer section-->
            <p>Caesar Cipher tool @ YenCryto</p>
        </footer>            <!--footer section-->
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
